* {

body {

/* ===== HEADER ===== */

header {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 75px;

    padding: 0 6%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(7, 9, 16, 0.9);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}


.logo {

    display: flex;

    align-items: center;

    gap: 12px;

    font-size: 22px;

    font-weight: 900;
}


.logo-icon {

    width: 44px;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ffd85c,
            #e58b00
        );

    font-size: 23px;

    box-shadow:
        0 0 30px
        rgba(245,166,35,.25);
}


.logo span {

    color: #ffc34d;

}


nav {

    display: flex;

    gap: 28px;
}


nav a {

    color: #aeb5c2;

    text-decoration: none;

    font-size: 14px;

    font-weight: 700;

    transition: .2s;
}


nav a:hover {

    color: #ffc34d;

}


/* ===== HERO ===== */

.hero {

    position: relative;

    min-height: 530px;

    display: flex;

    align-items: center;

    padding: 80px 7%;

    overflow: hidden;

    background:

        linear-gradient(
            90deg,
            rgba(7,9,16,.98),
            rgba(7,9,16,.78),
            rgba(7,9,16,.25)
        );
}


.hero::after {

    content: "";

    position: absolute;

    width: 500px;

    height: 500px;

    right: 5%;

    top: 20px;

    background: #f5a623;

    filter: blur(170px);

    opacity: .15;

}


.hero-content {

    position: relative;

    z-index: 2;

    max-width: 650px;

}


.tag {

    display: inline-block;

    padding: 8px 14px;

    margin-bottom: 20px;

    border-radius: 30px;

    color: #ffc34d;

    background:
        rgba(245,166,35,.08);

    border:
        1px solid
        rgba(245,166,35,.3);

    font-size: 12px;

    font-weight: 900;
}


.hero h1 {

    font-size:
        clamp(48px, 7vw, 82px);

    line-height: .95;

    letter-spacing: -4px;

    margin-bottom: 25px;
}


.hero h1 span {

    color: #ffc34d;

}


.hero p {

    max-width: 570px;

    color: #969eae;

    font-size: 18px;

    line-height: 1.6;

    margin-bottom: 30px;

}


.buttons {

    display: flex;

    gap: 14px;
}


.btn {

    display: inline-block;

    padding: 16px 28px;

    border-radius: 13px;

    text-decoration: none;

    font-weight: 900;

    transition: .2s;
}


.btn-gold {

    background:
        linear-gradient(
            135deg,
            #ffd65c,
            #e99108
        );

    color: #151515;

}


.btn-dark {

    background:
        rgba(255,255,255,.05);

    border:
        1px solid #30394a;

    color: white;

}


.btn:hover {

    transform:
        translateY(-3px);

}


/* ===== STATS ===== */

.stats {

    position: relative;

    z-index: 5;

    width:
        min(
            1100px,
            calc(100% - 30px)
        );

    margin:
        -40px auto 0;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    background:
        rgba(20,25,36,.95);

    border:
        1px solid #293344;

    border-radius: 20px;

    overflow: hidden;

}


.stat {

    padding: 25px;

    text-align: center;

    border-right:
        1px solid #293344;

}
